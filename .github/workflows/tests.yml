name: Tests

on:
  push:
  pull_request:
  # "Run workflow" button in the Actions tab. Push and PR runs use the defaults: all suites, 1 retry.
  workflow_dispatch:
    inputs:
      suite:
        description: Which tests to run
        type: choice
        options: [all, api, ui]
        default: all
      retries:
        description: Retries for a failed test
        type: choice
        options: ['0', '1', '2', '3']
        default: '1'

env:
  # Empty on push and PR runs, so the shell falls back to 1 (the same as the config's CI value)
  RETRIES: ${{ inputs.retries }}

# A newer push to the same branch cancels the older run
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  api-tests:
    name: API tests
    needs: static-checks
    if: ${{ inputs.suite != 'ui' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EVENTHUB_USER_EMAIL: ${{ secrets.EVENTHUB_USER_EMAIL }}
      EVENTHUB_USER_PASSWORD: ${{ secrets.EVENTHUB_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check secrets are set
        run: |
          missing=0
          for name in EVENTHUB_USER_EMAIL EVENTHUB_USER_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Repository secret $name is not set (Settings > Secrets and variables > Actions)"; missing=1; fi
          done
          exit $missing
      - run: npm ci
      - run: npm run test:api -- --retries=${RETRIES:-1}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: api-report
          path: playwright-report/
          retention-days: 14

  # Runs after the API job, not beside it: both suites book the same event on the same account,
  # and the seat-count checks would read each other's bookings. Still runs when the API tests fail or are skipped.
  ui-tests:
    name: UI tests
    needs: [static-checks, api-tests]
    if: ${{ !cancelled() && needs.static-checks.result == 'success' && inputs.suite != 'api' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EVENTHUB_USER_EMAIL: ${{ secrets.EVENTHUB_USER_EMAIL }}
      EVENTHUB_USER_PASSWORD: ${{ secrets.EVENTHUB_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check secrets are set
        run: |
          missing=0
          for name in EVENTHUB_USER_EMAIL EVENTHUB_USER_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Repository secret $name is not set (Settings > Secrets and variables > Actions)"; missing=1; fi
          done
          exit $missing
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui -- --retries=${RETRIES:-1}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ui-report
          path: playwright-report/
          retention-days: 14
